name: Liangce API checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-hosted.txt httpx
      - run: python -m unittest tests.test_research_api tests.test_hosted_server -v
        env:
          PYTHONUTF8: '1'
