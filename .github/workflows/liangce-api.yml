name: Liangce API checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-hosted.txt httpx
      - run: python -m unittest tests.test_research_api tests.test_hosted_server tests.test_research_quotes tests.test_chan_six_signals tests.test_realtime_panel tests.test_tdx_provider -v
        env:
          PYTHONUTF8: '1'
  hosted-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build minimal hosted image
        run: docker build -f Dockerfile.hosted -t liangce-hosted .
      - name: Check gateway dependencies in the actual image
        run: docker run --rm liangce-hosted python -c "from web.hosted_server import app; import market_gateway"
      - name: Check pinned TDX bridge starts without a provider connection
        run: |
          docker run -d --name liangce-tdx-bridge --entrypoint /usr/local/bin/liangce-tdx liangce-hosted
          docker exec liangce-tdx-bridge python -c "from urllib.request import urlopen;import json;data=json.load(urlopen('http://127.0.0.1:18081/api/health',timeout=5));assert data['code']==0;assert data['data']['timezone']=='Asia/Shanghai'"
      - name: Check HTTP health, CORS and actual archive
        run: |
          docker run -d --name liangce-hosted -p 8810:8810 liangce-hosted
          python - <<'PY'
          import gzip, json, time
          from urllib.request import Request, urlopen
          base='http://127.0.0.1:8810'
          for attempt in range(30):
              try:
                  with urlopen(base+'/api/research/health', timeout=2) as response:
                      health=json.load(response)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Hosted container did not become healthy')
          assert health['status']=='ok'
          assert health['compute_limits']=={'workers':1,'queue':2,'max_input_bars':8000}
          assert health['runtime_storage']=='ephemeral'
          request=Request(base+'/api/research/jobs', method='OPTIONS', headers={
              'Origin':'https://nnn256.github.io',
              'Access-Control-Request-Method':'POST',
              'Access-Control-Request-Headers':'content-type'})
          with urlopen(request, timeout=5) as response:
              assert response.headers['Access-Control-Allow-Origin']=='https://nnn256.github.io'
          with urlopen(base+'/research/sz300949__day.json.gz', timeout=5) as response:
              panel=json.loads(gzip.decompress(response.read()))
          assert len(panel['bars'])==1381
          request=Request(base+'/api/research/jobs', method='POST',
              headers={'Origin':'https://liangce-v3-api-production.up.railway.app',
                       'Content-Type':'application/json'},
              data=json.dumps({'period':'day','cutoff':'2022-01-10','mode':'backtest'}).encode())
          with urlopen(request, timeout=5) as response:
              assert response.status==202
              job=json.load(response)
          for attempt in range(20):
              with urlopen(base+'/api/research/jobs/'+job['id'], timeout=5) as response:
                  job=json.load(response)
              if job['state'] in ('completed','failed'):
                  break
              time.sleep(1)
          assert job['state']=='completed',job
          print('Minimal container HTTP, CORS, archive, same-origin jobs and resource limits passed')
          PY
      - name: Show container logs
        if: always()
        run: docker logs liangce-hosted || true
