services:
  - type: web
    name: liangce-v3-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements-hosted.txt
    startCommand: uvicorn web.hosted_server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/research/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PYTHONUTF8
        value: '1'
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: LIANGCE_HOSTING
        value: render-free
      - key: LIANGCE_EPHEMERAL
        value: '1'
      - key: LIANGCE_ALLOWED_ORIGINS
        value: https://nnn256.github.io
      - key: LIANGCE_RUNTIME
        value: /tmp/liangce-research
      - key: LIANGCE_WORKERS
        value: '1'
      - key: LIANGCE_QUEUE_LIMIT
        value: '2'
      - key: LIANGCE_MAX_COMPUTE_BARS
        value: '8000'
      - key: LIANGCE_READONLY
        value: '0'
      - key: STOCK_DATA_HOME
        value: /tmp/liangce-data
